name: E2E and Unit Tests

on:
  push:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Create env file
        run: |
          touch .env
          echo "PUBLIC_RPC_URL=${{ secrets.PUBLIC_RPC_URL }}" >> .env
          echo "VITE_PUBLIC_PROJECT_ID=${{ secrets.VITE_PUBLIC_PROJECT_ID }}" >> .env
          echo "VITE_PUBLIC_ALCHEMY_KEY=${{ secrets.VITE_PUBLIC_ALCHEMY_KEY }}" >> .env
      - name: Run unit tests
        run: pnpm test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Create env file
        run: |
          touch .env
          echo "VITE_PUBLIC_PROJECT_ID=${{ secrets.VITE_PUBLIC_PROJECT_ID }}" >> .env
          echo "VITE_PUBLIC_ALCHEMY_KEY=${{ secrets.VITE_PUBLIC_ALCHEMY_KEY }}" >> .env
          echo "VITE_PUBLIC_IS_PLAYWRIGHT='true'" >> .env
      - name: Run E2E tests
        run: pnpm playwright:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
